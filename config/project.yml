# Project Configuration
# Generated by 01-template
# Updated: 2026-09-24 (V3 — Flutter native app, ultrasonic audio token, identity-fraud defense, SSE, Privacy-by-Design)

project:
  name: "Syncattend Dual Auth Smart Attendance  Academic Management System"
  code: "SDAS"
  slug: "syncattend-dual-auth-smart-attendance--academic-management-system"
  type: "web"
  subtype: "spa"
  created: "2026-09-17"
  version: "v3"

tier: "comprehensive"

# V3 layered defense:
#   dynamic QR (time/identity) + ultrasonic audio token (space/proximity)
#   + identity-fraud defense (1-min window + server uniqueness + device binding)
#   + professor-in-the-loop confirmation (human). Replaces V2 BLE approach.
auth:
  method: "dual"
  identity_signal: "dynamic_qr"                # 15s TTL rotating token (Redis)
  proximity_signal: "ultrasonic_audio_token"   # 18-20kHz nonce, 15s rotation
  single_use_nonce: true                        # server consumes each nonce once; re-submission rejected (relay blocking)
  human_layer: "professor_in_the_loop"         # unverified != auto-absent; window extendable

# TOP technical risk: laptop-speaker ultrasonic emission + student-device mic decode is UNPROVEN.
# Verify first via a feasibility spike; prepare fallback if unreliable.
audio_feasibility:
  status: "unverified_top_risk"
  spike_window: "M1_start..M2_conclude"
  verify: "18-20kHz emission + mic decode at classroom distance/noise across devices"
  fallback:
    - "audible_low_band"      # low audible band, less intrusive
    - "screen_side_signal"    # screen-displayed auxiliary signal

# Identity-fraud (one-device-multi-account) defense.
# QR/audio prove proximity, not identity; this layer closes that gap.
identity_defense:
  auth_window_seconds: 60                       # ~1 minute, professor-opened, extendable
  server_uniqueness: "one_attendance_per_account_and_per_device_uuid_per_session"
  device_binding:
    id_type: "app_generated_uuid"               # NOT hardware ID, NOT device_info_plus OS ID
    storage: "keychain_keystore"
    libraries:
      - flutter_secure_storage
      - flutter_udid
    device_info_plus_for_security: false        # OS IDs change on reinstall/reset; unfit as key
    new_uuid_requires_email_reauth: true         # app-data wipe -> new UUID; NO auto-bind, email re-auth first
    known_boundary: "app_data_wipe_regenerates_uuid -> mitigated by mandatory email re-auth + change logging"
  device_change_reregistration:
    method: "school_email_verification"
    email_domain: "@wku.ac.kr"
  frontend_lock: "ux_nudge_only"                # soft dialog; NO hard cooldown / session lock
  biometric: "optional_future"                  # Face ID / fingerprint (WebAuthn/FIDO); not required
  residual_attack: "multiple_phones -> professor_anomaly_detection"

tech_stack:
  backend:
    language: "Python"
    version: "3.12"
    framework: "fastapi"
    orm: "sqlalchemy"

  student_app:
    type: "native_mobile"
    framework: "flutter"
    features:
      - "qr_scanner"
      - "mic_audio_token_decode"     # FFT / band filter
      - "device_uuid_binding"        # flutter_secure_storage / flutter_udid
      - "school_email_reauth"        # device change re-registration

  frontend:
    framework: "react"               # professor dashboard (web)
    ui_library: "TailwindCSS, shadcn/ui"
    state_management: "Zustand"

  realtime:
    mechanism: "sse"                 # lightweight one-way; no persistent WebSocket
    websocket: "optional"            # deferred / non-core

# Traffic handled as two distinct phases.
traffic:
  peak_insert:                        # class-start concurrent auth submissions
    strategy: "redis_atomic"
    ops:
      - "SET NX"
      - "counter"
    note: "avoid PostgreSQL row-lock contention; individual auth as lightweight append"
  close_batch:                        # attendance close
    strategy: "delta_batch_update"    # update only changed (unverified) records
  read_cache: "redis_precache"        # cumulative absence etc. to ease SELECT stampede

  databases:
    key_value:
      - Redis                        # 15s TTL QR / audio nonce, cache
    relational:
      - PostgreSQL                   # users, courses, attendance, device_bindings

  infrastructure:
    cloud:
      - none
    serverless:
      - Vercel
      - Render
    baas:
      - Supabase
    container:
      - Docker
    cicd:
      - none

scope:
  deferred:
    - "ai_certificate_reading"       # v-next: sensitive health data / OCR misread / liability
    - "biometric_attendance_signing" # optional future (1-min window covers primary case)
  out_of_scope:
    - "ble_beacon_proximity"         # iOS Safari lacks Web Bluetooth; replaced by audio token
    - "device_info_plus_as_security_key" # OS IDs change on reinstall/reset
    - "hard_frontend_logout_cooldown"    # duplicates server rule; false positives
    - "absolute_proxy_prevention"        # goal is structural deterrence, not 0%

privacy:
  by_design: true
  consent_on_first_use: true
  data_minimization: true            # store "proximity pass boolean", not raw audio/location
  audio_token_discard: "after_session"
  device_change_logged: true         # audit trail for anomaly detection
  retention: "academic_regulation_period"

options:
  gsd_workflow: true
  code_scaffolding: false
  korean_localization: true
