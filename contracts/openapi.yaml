openapi: 3.0.3
info:
  title: Syncattend (SDAS) API Contract
  version: 0.1.0-draft
  description: >
    Shared API contract for Syncattend V3 (dual-auth smart attendance).
    OWNERSHIP: this file is the single source of truth for the HTTP contract.
    Only backend (owner A) may modify it. mobile (B) and web (C) READ ONLY.
    Layered defense: dynamic QR (time/identity) + ultrasonic audio token
    (space/proximity) + identity defense (1-min window + server uniqueness +
    app-generated UUID device binding + @wku.ac.kr re-registration) + professor-in-the-loop.

servers:
  - url: http://localhost:8000
    description: Local dev (backend)

tags:
  - name: health
  - name: auth
  - name: devices
  - name: courses
  - name: sessions
  - name: attendance
  - name: sse

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness/health check
      operationId: getHealth
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  # ---------------------------------------------------------------- auth
  /auth/send-code:
    post:
      tags: [auth]
      summary: Email a signup verification code
      description: >
        Sends a 6-digit verification code to a @wku.ac.kr email. The code is
        stored in Redis with a 15-minute TTL. Already-registered emails are
        rejected (409). Delivery is via SMTP when configured, otherwise the
        code is logged as a dev stub. Team member's signup flow step 1.
      operationId: sendSignupCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendCodeRequest' }
      responses:
        '202':
          description: Code sent (or logged in dev stub mode)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyCodeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/verify-code:
    post:
      tags: [auth]
      summary: Verify a signup code
      description: >
        Validates the 6-digit code. On success the email is marked verified in
        Redis (15-minute TTL) and may be used to complete /auth/register.
        Single-use: the code is consumed on success. Team member's signup flow
        step 2.
      operationId: verifySignupCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyCodeRequest' }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyCodeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new account (student/professor)
      description: >
        Creates an account with a bcrypt/argon2-hashed password. Student
        accounts must use a @wku.ac.kr email (identity defense). The email
        MUST have completed /auth/send-code + /auth/verify-code first (the
        verified flag is consumed on success). Duplicate emails are rejected
        with 409. Team member's signup flow step 3.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterUserRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserOut' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [auth]
      summary: Login, issue JWT
      operationId: login
      description: >
        The client declares its type via the `X-Client-Type` header (web|mobile)
        so the server can enforce client gating: the web dashboard is
        professor-only and the mobile app is student-only. A role mismatch
        (e.g. a student logging into the web) is rejected with 403 before a
        token is issued.
      parameters:
        - in: header
          name: X-Client-Type
          description: >
            The calling client. `web` → only professor accounts may log in;
            `mobile` → only student accounts. Omitted/unknown → no gating.
          required: false
          schema:
            type: string
            enum: [web, mobile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Role not allowed for this client type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [auth]
      summary: Current authenticated user's profile
      description: >
        Returns the authenticated user's id/email/role/name from the access
        token alone. Lets clients resolve their own account id without decoding
        the JWT — e.g. the mobile app subscribing to /sse/students/{id} and the
        student attendance history view.
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserOut' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------- devices
  /devices/register:
    post:
      tags: [devices]
      summary: Bind app-generated UUID to account (NO auto-bind for new/unknown UUID)
      description: >
        First binding of a new/unknown UUID must go through email re-auth.
        This endpoint binds only when the account has no binding conflict;
        otherwise it returns 409 and the client must use /devices/reregister/*.
      operationId: registerDevice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_uuid]
              properties:
                device_uuid: { type: string, format: uuid }
      responses:
        '200':
          description: Device bound
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceBinding' }
        '409':
          description: Binding conflict — email re-registration required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /devices/reregister/request:
    post:
      tags: [devices]
      summary: Request device change — send verification code to @wku.ac.kr email
      operationId: reregisterRequest
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: Must be a @wku.ac.kr address
      responses:
        '202': { description: Verification code sent }
        '400': { $ref: '#/components/responses/BadRequest' }

  /devices/reregister/confirm:
    post:
      tags: [devices]
      summary: Confirm email code and rebind to new UUID
      operationId: reregisterConfirm
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, new_device_uuid]
              properties:
                email: { type: string, format: email }
                code: { type: string }
                new_device_uuid: { type: string, format: uuid }
      responses:
        '200':
          description: Rebound to new device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceBinding' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /devices/me:
    get:
      tags: [devices]
      summary: Current account device binding
      operationId: getMyDevice
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Binding info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceBinding' }

  # ------------------------------------------------------------- courses
  /courses:
    post:
      tags: [courses]
      summary: Professor creates a course
      operationId: createCourse
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCourseRequest' }
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [courses]
      summary: List courses owned by the authenticated professor
      operationId: listCourses
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Course' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /courses/catalog:
    get:
      tags: [courses]
      summary: Browse all offered courses (any authenticated user)
      description: >
        Full course catalog for timetable planning. Available to any
        authenticated user (student or professor), not just professors. Each
        item carries an `enrolled` flag for the calling user. Optional `q`
        filters by course name / professor name / 학수번호 (case-insensitive
        substring) to back autocomplete; absent/blank `q` returns everything.
      operationId: listCourseCatalog
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match on name / professor_name / code.
          schema: { type: string }
      responses:
        '200':
          description: Course catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CourseCatalogItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /courses/{course_id}:
    patch:
      tags: [courses]
      summary: Update a course (professor-owned course only)
      operationId: updateCourse
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCourseRequest' }
      responses:
        '200':
          description: Course updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [courses]
      summary: Delete a course (professor-owned course only)
      description: >
        Deletes the course; enrollments and sessions (and their attendance)
        cascade via FK ON DELETE CASCADE.
      operationId: deleteCourse
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      responses:
        '204': { description: Course deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courses/{course_id}/enroll-self:
    post:
      tags: [courses]
      summary: Student enrolls themselves in a course
      operationId: enrollSelf
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      responses:
        '201':
          description: Enrolled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already enrolled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [courses]
      summary: Student cancels their own enrollment
      operationId: unenrollSelf
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      responses:
        '204': { description: Unenrolled }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/courses:
    get:
      tags: [courses]
      summary: Courses the calling student is enrolled in (timetable source)
      operationId: listMyCourses
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Enrolled courses with schedule fields
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MyCourseItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /courses/{course_id}/enrollments:
    post:
      tags: [courses]
      summary: Enroll a student in a course (professor-owned course only)
      operationId: enrollStudent
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollRequest' }
      responses:
        '201':
          description: Student enrolled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already enrolled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [courses]
      summary: List enrollments for a course (professor-owned course only)
      operationId: listEnrollments
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      responses:
        '200':
          description: Enrollments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Enrollment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courses/{course_id}/simulate-bots:
    post:
      tags: [courses]
      summary: Populate dashboard with virtual bot students (no cleanup)
      description: >
        Enrolls `count` synthetic students in this course SYNCHRONOUSLY, so the
        dashboard's total + 미인증 (and the course roster) reflect them
        immediately — BEFORE the professor opens a session. A `present_ratio`
        fraction are then scheduled to verify attendance through the REAL verify
        path once the session's auth window opens, after a random delay in
        [delay_min, delay_max] seconds, so 출석 trickles into the realtime
        dashboard (SSE) one-by-one; the rest stay 미인증. Calling again ADDS
        more bots (UUID-based labels prevent email/student_id/device_uuid
        collision). Data is NOT cleaned up — call DELETE on the same path to
        remove ALL bots at once afterwards. Professor-only; course owned by the
        caller. Tokens are shared across bots (cross_verify does not consume
        them; per-student uniqueness is DB-enforced).
      operationId: simulateBots
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulateBotsRequest' }
      responses:
        '200':
          description: >
            Bot population summary (scheduled counts). Bots verify in the
            background once the session window opens; actual counts appear in
            the dashboard / aggregate as they complete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulateBotsResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [courses]
      summary: Remove all virtual bot students (cascade their data)
      description: >
        Deletes every synthetic bot student (and their devices/enrollments/
        attendance) so the dashboard returns to real data. Professor-only.
      operationId: cleanupBots
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CourseId' }]
      responses:
        '200':
          description: Cleanup result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotCleanupResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------ sessions
  /sessions:
    post:
      tags: [sessions]
      summary: Professor starts an attendance session (opens ~60s auth window)
      operationId: createSession
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [course_id]
              properties:
                course_id: { type: string }
                window_seconds: { type: integer, default: 60 }
                week_number:
                  type: integer
                  minimum: 1
                  maximum: 15
                  nullable: true
                  description: academic week (1..15주차); optional
      responses:
        '201':
          description: Session created, window open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }

  /sessions/{id}/window/extend:
    post:
      tags: [sessions]
      summary: Extend/reopen the auth window (professor-in-the-loop)
      operationId: extendWindow
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                add_seconds: { type: integer, default: 60 }
      responses:
        '200':
          description: Window extended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }

  /sessions/{id}/checkout:
    post:
      tags: [sessions]
      summary: Open the check_out (end-of-class) auth window
      description: >
        Transitions the session phase check_in → check_out and opens a fresh
        auth window. Students then verify again against this end-of-class
        window. Professor-only; session must be owned by the caller and still
        in the check_in phase.
      operationId: openCheckout
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenCheckoutRequest' }
      responses:
        '200':
          description: Checkout window opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Session is closed, or checkout window already open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sessions/{id}/close:
    post:
      tags: [sessions]
      summary: Close session
      operationId: closeSession
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Session closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }

  /sessions/{id}/token:
    get:
      tags: [sessions]
      summary: Current QR token + audio nonce (15s TTL, single-use)
      description: >
        Professor client polls this to render the rotating QR and emit the
        ultrasonic audio nonce. Both tokens rotate every 15s and are single-use.
      operationId: getSessionToken
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Current tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionToken' }

  /sessions/{id}/simulate:
    post:
      tags: [sessions]
      summary: Virtual attendance simulation (all verify cases against real path)
      description: >
        Creates synthetic students/devices and runs every verification case
        (normal / window-closed / cross-verify-fail / device-mismatch /
        duplicate) through the REAL verify path so the professor can confirm
        each gate behaves as designed. Synthetic data is cleaned up afterwards.
        Professor-only; session must be owned by the caller.
      operationId: simulateAttendance
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Per-case simulation results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResult' }
        '403':
          description: Not the session owner / not a professor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------- attendance
  /attendance/verify:
    post:
      tags: [attendance]
      summary: Student cross-verification (window + QR×audio + single-use nonce + device + uniqueness)
      description: >
        Server verification order:
        (1) auth window open, (2) QR×audio cross-verify,
        (3) single-use nonce not yet consumed (consume on pass),
        (4) device_uuid matches account binding,
        (5) uniqueness: one attendance per account & per device_uuid per session.
      operationId: verifyAttendance
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyRequest' }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyResult' }
        '409':
          description: Rejected (see reason)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyResult' }

  /me/attendance:
    get:
      tags: [attendance]
      summary: Authenticated student's own attendance history
      description: >
        Returns the calling student's attendance records (newest first) joined
        with course context (course_id/name, session opened time). Backs the
        mobile student history screen with real data instead of a placeholder.
      operationId: getMyAttendance
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Attendance history for the authenticated student
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MyAttendanceItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sessions/{id}/attendance:
    get:
      tags: [attendance]
      summary: Live attendance rate + unverified list (professor)
      operationId: getSessionAttendance
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Aggregation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceAggregate' }

  /sessions/{id}/attendance/export:
    get:
      tags: [attendance]
      summary: Export a session's full attendance roster as downloadable JSON
      description: >
        Returns every enrolled student with final status (present/absent/late/
        early_leave/pending), check_in/check_out timestamps, and correction
        info, plus session/course context and date. Suitable for archival /
        later JSON extraction. Professor-only.
      operationId: exportSessionAttendance
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: JSON attendance file
          content:
            application/json:
              schema: { type: object }
        '403':
          description: Not the session owner / not a professor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sessions/{id}/attendance/batch:
    post:
      tags: [attendance]
      summary: Delta-based batch close (only changed/unverified records)
      operationId: batchCloseAttendance
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deltas]
              properties:
                deltas:
                  type: array
                  items: { $ref: '#/components/schemas/AttendanceDelta' }
      responses:
        '200':
          description: Batch applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceAggregate' }

  /attendance/{record_id}:
    patch:
      tags: [attendance]
      summary: Manual correction of one record (professor-in-the-loop)
      operationId: correctAttendance
      security: [{ bearerAuth: [] }]
      parameters:
        - name: record_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/AttendanceStatus' }
      responses:
        '200':
          description: Updated record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecord' }

  # ---------------------------------------------------------------- sse
  /sse/students/{id}:
    get:
      tags: [sse]
      summary: Student risk-group warning stream (SSE)
      operationId: sseStudent
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        # EventSource cannot set Authorization headers, so the access token is
        # accepted as a query param instead (bearer header still works for curl).
        - name: access_token
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: text/event-stream of RiskWarning events
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/RiskWarning' }

  /sse/sessions/{id}:
    get:
      tags: [sse]
      summary: Professor live attendance stream (SSE)
      operationId: sseSession
      security: [{ bearerAuth: [] }]
      parameters:
        - [{ $ref: '#/components/parameters/SessionId' }]
        # EventSource cannot set Authorization headers, so the access token is
        # accepted as a query param instead (bearer header still works for curl).
        - name: access_token
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: text/event-stream of AttendanceAggregate events
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/AttendanceAggregate' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    CourseId:
      name: course_id
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: syncattend-backend }
        version: { type: string, example: 0.1.0 }

    Error:
      type: object
      properties:
        detail: { type: string }
        code: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: bearer }
        role: { $ref: '#/components/schemas/Role' }

    Role:
      type: string
      enum: [student, professor]

    RegisterUserRequest:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        role: { $ref: '#/components/schemas/Role' }
        name: { type: string, nullable: true }
        student_id:
          type: string
          nullable: true
          maxLength: 32
          description: >
            학번. Required for role=student (unique across all users); professors
            must omit it (stored as NULL).

    SendCodeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: >
            School email (@wku.ac.kr). Validated server-side; case-insensitive.

    VerifyCodeRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string }
        code: { type: string, description: 6-digit verification code }

    VerifyCodeResult:
      type: object
      properties:
        verified: { type: boolean }
        message: { type: string }

    UserOut:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        name: { type: string, nullable: true }
        student_id:
          type: string
          nullable: true
          maxLength: 32
          description: 학번. Present for students, NULL for professors.

    CreateCourseRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        code: { type: string, nullable: true, description: 학수번호 e.g. "374142" }
        department: { type: string, nullable: true, description: 학과명 }
        professor_name: { type: string, nullable: true, description: 표시용 교수명 }
        day_of_week:
          type: integer
          nullable: true
          minimum: 0
          maximum: 6
          description: 요일 (0=Mon .. 6=Sun) for timetable placement
        start_period:
          type: integer
          nullable: true
          minimum: 1
          maximum: 12
          description: >-
            시작 교시. Periods are 1..12, each 60 min, period 1 starts 09:00
            (Nth start = 08:00 + N시간). Must be <= end_period (else 422).
        end_period:
          type: integer
          nullable: true
          minimum: 1
          maximum: 12
          description: 종료 교시 (1..12, >= start_period).
        location: { type: string, nullable: true, description: 강의실 }
        credits: { type: number, nullable: true, description: 학점 }

    UpdateCourseRequest:
      type: object
      description: Partial update — only provided fields are applied.
      properties:
        name: { type: string }
        code: { type: string, nullable: true }
        department: { type: string, nullable: true }
        professor_name: { type: string, nullable: true }
        day_of_week: { type: integer, nullable: true, minimum: 0, maximum: 6 }
        start_period:
          type: integer
          nullable: true
          minimum: 1
          maximum: 12
          description: 시작 교시 (1..12). Must be <= end_period (else 422).
        end_period:
          type: integer
          nullable: true
          minimum: 1
          maximum: 12
          description: 종료 교시 (1..12, >= start_period).
        location: { type: string, nullable: true }
        credits: { type: number, nullable: true }

    Course:
      type: object
      properties:
        id: { type: string }
        professor_id: { type: string }
        name: { type: string }
        code: { type: string, nullable: true }
        department: { type: string, nullable: true }
        professor_name: { type: string, nullable: true }
        day_of_week: { type: integer, nullable: true, minimum: 0, maximum: 6 }
        start_period: { type: integer, nullable: true }
        end_period: { type: integer, nullable: true }
        location: { type: string, nullable: true }
        credits: { type: number, nullable: true }
        created_at: { type: string, format: date-time }

    CourseCatalogItem:
      type: object
      description: A course in the browsable catalog, with the caller's enrollment flag.
      properties:
        id: { type: string }
        professor_id: { type: string }
        name: { type: string }
        code: { type: string, nullable: true }
        department: { type: string, nullable: true }
        professor_name: { type: string, nullable: true }
        day_of_week: { type: integer, nullable: true, minimum: 0, maximum: 6 }
        start_period: { type: integer, nullable: true }
        end_period: { type: integer, nullable: true }
        location: { type: string, nullable: true }
        credits: { type: number, nullable: true }
        enrolled: { type: boolean, description: whether the calling student is enrolled }

    MyCourseItem:
      type: object
      description: A course the calling student is enrolled in (timetable source).
      properties:
        id: { type: string }
        professor_id: { type: string }
        name: { type: string }
        code: { type: string, nullable: true }
        department: { type: string, nullable: true }
        professor_name: { type: string, nullable: true }
        day_of_week: { type: integer, nullable: true, minimum: 0, maximum: 6 }
        start_period: { type: integer, nullable: true }
        end_period: { type: integer, nullable: true }
        location: { type: string, nullable: true }
        credits: { type: number, nullable: true }

    EnrollRequest:
      type: object
      required: [student_id]
      properties:
        student_id: { type: string }

    Enrollment:
      type: object
      properties:
        course_id: { type: string }
        student_id: { type: string }
        student_number: { type: string, nullable: true, description: school student number joined from the user (bots surface as "SIMbot…") }
        name: { type: string, nullable: true, description: display name joined from the user }

    DeviceBinding:
      type: object
      properties:
        account_id: { type: string }
        device_uuid: { type: string, format: uuid }
        bound_at: { type: string, format: date-time }

    Session:
      type: object
      properties:
        session_id: { type: string }
        course_id: { type: string }
        week_number: { type: integer, minimum: 1, maximum: 15, nullable: true, description: academic week (1..15주차) }
        window_open: { type: boolean }
        window_remaining: { type: integer, description: seconds left in the currently active auth window }
        phase:
          type: string
          enum: [check_in, check_out, closed]
          description: >
            Attendance lifecycle phase. check_in = the start-of-class auth
            window is open; check_out = the end-of-class auth window is open
            (professor opened checkout); closed = session finalised.

    SessionToken:
      type: object
      properties:
        session_id: { type: string }
        qr_token: { type: string }
        audio_nonce:
          type: string
          pattern: '^[0-9a-e]{8}$'
          description: >-
            acoustic hex nonce: 8 nibbles, excludes 'f' which is the ultrasonic
            start-marker slot. Transmitted whole over the ultrasonic channel.
          example: a1b2c3d4
        expires_in: { type: integer, example: 15 }
        window_open: { type: boolean }
        window_remaining: { type: integer }

    OpenCheckoutRequest:
      type: object
      description: >-
        Body for opening the check_out auth window. window_seconds is optional;
        omitted, it defaults to the configured auth window length.
      properties:
        window_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          nullable: true
          default: null
          description: Length (seconds) of the check_out auth window.

    VerifyRequest:
      type: object
      required: [session_id, qr_token, audio_nonce, device_uuid]
      properties:
        session_id: { type: string }
        qr_token: { type: string }
        audio_nonce:
          type: string
          pattern: '^[0-9a-e]{8}$'
          description: >-
            acoustic hex nonce: 8 nibbles, excludes 'f' which is the ultrasonic
            start-marker slot. Must equal the nonce decoded from the ultrasonic signal.
          example: a1b2c3d4
        device_uuid: { type: string, format: uuid }

    VerifyResult:
      type: object
      properties:
        status: { type: string, enum: [verified, pending, rejected], description: "verified = the student passed the current phase's auth window; the final attendance status is only resolved at batchClose." }
        cross_verified: { type: boolean }
        device_matched: { type: boolean }
        reason:
          type: string
          enum: [window_closed, cross_verify_failed, nonce_reused, device_mismatch, duplicate_attendance]
          nullable: true
        check_phase:
          type: string
          enum: [check_in, check_out]
          nullable: true
          description: Which phase this verify counted towards (set on success, null on rejection).
        risk_warning:
          $ref: '#/components/schemas/RiskWarning'
          nullable: true

    SimulationCase:
      type: object
      description: One verification scenario run during simulation.
      properties:
        name: { type: string }
        expected_rejected: { type: boolean }
        expected_reason:
          type: string
          enum: [window_closed, cross_verify_failed, nonce_reused, device_mismatch, duplicate_attendance]
          nullable: true
        rejected: { type: boolean }
        reason:
          type: string
          enum: [window_closed, cross_verify_failed, nonce_reused, device_mismatch, duplicate_attendance]
          nullable: true
        passed: { type: boolean, description: True if the actual outcome matched the expected }

    SimulationResult:
      type: object
      properties:
        session_id: { type: string }
        cases:
          type: array
          items: { $ref: '#/components/schemas/SimulationCase' }
        cleaned_up: { type: boolean }

    SimulateBotsRequest:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
          description: Number of virtual bot students to create.
        present_ratio:
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 0.7
          description: Fraction of bots that successfully verify (present).
        delay_min:
          type: number
          format: float
          minimum: 0
          maximum: 600
          default: 5
          description: Minimum random delay (seconds) before each bot verifies.
        delay_max:
          type: number
          format: float
          minimum: 0
          maximum: 600
          default: 25
          description: Maximum random delay (seconds) before each bot verifies.

    SimulateBotsResult:
      type: object
      properties:
        course_id: { type: string }
        total_bots: { type: integer }
        present: { type: integer }
        unverified: { type: integer }

    BotCleanupResult:
      type: object
      properties:
        course_id: { type: string }
        removed: { type: integer }
        cleaned_up: { type: boolean }

    AttendanceStatus:
      type: string
      enum: [present, absent, late, early_leave, pending]
      description: >
        Final status, resolved at batchClose from the check_in/check_out
        timestamps: present (both passed), late (check_out only),
        early_leave (check_in only), absent (neither). `pending` until closed.

    AttendanceRecord:
      type: object
      properties:
        record_id: { type: string }
        session_id: { type: string }
        student_id: { type: string }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        check_in_verified_at: { type: string, format: date-time, nullable: true, description: When the student passed the start (check_in) auth window. }
        check_out_verified_at: { type: string, format: date-time, nullable: true, description: When the student passed the end (check_out) auth window. }

    MyAttendanceItem:
      type: object
      description: One row of a student's own attendance history, with course context.
      properties:
        record_id: { type: string }
        session_id: { type: string }
        course_id: { type: string }
        course_name: { type: string }
        week_number: { type: integer, minimum: 1, maximum: 15, nullable: true, description: academic week (1..15주차) }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        check_in_verified_at: { type: string, format: date-time, nullable: true }
        check_out_verified_at: { type: string, format: date-time, nullable: true }
        session_opened_at: { type: string, format: date-time, nullable: true }

    AttendanceDelta:
      type: object
      required: [student_id, status]
      properties:
        student_id: { type: string }
        status: { $ref: '#/components/schemas/AttendanceStatus' }

    AttendanceAggregate:
      type: object
      properties:
        session_id: { type: string }
        total: { type: integer }
        present: { type: integer }
        absent: { type: integer, description: Students resolved as absent (closed session). }
        late: { type: integer, description: Students resolved as late (check_out only). Closed session only. }
        early_leave: { type: integer, description: Students resolved as early_leave (check_in only). Closed session only. }
        unverified:
          type: array
          description: Students with no resolved status yet (still pending / no record), with readable display fields.
          items: { $ref: '#/components/schemas/UnverifiedStudent' }

    UnverifiedStudent:
      type: object
      description: |
        A student who has not yet verified for a session. `student_id` is the
        internal user id (UUID) used as the Delta/batch key; `student_number`
        is the school 학번 and `name` the display name, both joined from the
        user so the professor review table shows human-readable values instead
        of raw UUIDs.
      properties:
        student_id: { type: string, description: Internal user id (UUID) — the Delta/batch key. }
        student_number: { type: string, nullable: true, description: School 학번. }
        name: { type: string, nullable: true, description: Display name. }

    RiskWarning:
      type: object
      properties:
        level: { type: string, enum: [info, warning, danger] }
        absences: { type: integer }
        message: { type: string }
