name: syncattend_mobile
description: Syncattend student app (Flutter) — QR scan + ultrasonic audio decode + device UUID binding.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  # Identity defense — app-generated UUID stored in Keychain/Keystore:
  flutter_secure_storage: ^9.2.2
  flutter_udid: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
