name: syncattend_mobile
description: Syncattend student app (Flutter) — QR scan + ultrasonic audio decode + device UUID binding.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- State management (rationale documented in README): Riverpod for
  #     compile-safe providers, first-class Stream/Future providers (SSE,
  #     async auth/verify), and easy overriding for mock mode + tests.
  flutter_riverpod: ^2.5.1

  # --- Networking / contract client
  dio: ^5.7.0

  # --- Identity defense: app-generated UUID stored in Keychain/Keystore
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1

  # --- Attendance layered defense
  mobile_scanner: ^5.2.3          # dynamic QR scan
  record: ^5.1.2                  # microphone PCM stream capture
  fftea: ^1.5.0+1                 # FFT for 18-20kHz audio nonce decode

  # --- Permissions (mic + camera) with denial fallback
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
